name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-node:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run unit and integration tests
        run: npm test

      - name: Verify CLI help and proxy-check on example template
        run: |
          node ./bin/cage-oneclick.mjs --help
          node ./bin/cage-oneclick.mjs proxy-check --yaml ./examples/clash-template.example.yaml

      - name: Verify PowerShell AST syntax (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem scripts/*.ps1) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax error in $($f.Name)"
            }
            Write-Host "AST OK: $($f.Name)"
          }
